repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # tsconfig*.json are JSONC (allow comments) — strict JSON parser can't read them
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-added-large-files
        # The 512x512 app icon (~558 kB) exceeds the 500 kB default — allow it.
        exclude: ^frontend/public/fintracker\.png$
      - id: check-merge-conflict

  # Backend (Python) — lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Frontend (React/TS) — format
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.4
    hooks:
      - id: prettier
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, css, json, markdown]
