# Full stack: FastAPI backend + nginx-served frontend.
#   docker compose up --build
# Then open the app at http://localhost:8080 (API at http://localhost:8000).
services:
  backend:
    build: ./backend
    image: fintracker-backend
    environment:
      # SQLite file inside the mounted data volume.
      DATABASE_URL: sqlite:///./data/fintracker.db
      # The browser loads the app from the frontend's published port, so the API
      # must allow that origin (CORS_ORIGINS is parsed as a JSON list).
      CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time; the browser calls this URL.
        VITE_API_URL: http://localhost:8000
    image: fintracker-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
