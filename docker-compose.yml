# Full stack: Postgres + FastAPI backend + nginx-served frontend.
#   docker compose up --build
# Then open the app at http://localhost:8080 (API at http://localhost:8000).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintracker
      POSTGRES_PASSWORD: fintracker
      POSTGRES_DB: fintracker
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed so a backend run directly on the host (uv run) can reach it too.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintracker -d fintracker"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    image: fintracker-backend
    environment:
      DATABASE_URL: postgresql+psycopg://fintracker:fintracker@db:5432/fintracker
      # The browser loads the app from the frontend's published port, so the API
      # must allow that origin (CORS_ORIGINS is parsed as a JSON list).
      CORS_ORIGINS: '["http://localhost:8080"]'
      # Auth: accounts live in the DB (created via signup). Set a real JWT_SECRET
      # as a host secret in production.
      JWT_SECRET: dev-secret-change-me-in-production-please-32+chars
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time; the browser calls this URL.
        VITE_API_URL: http://localhost:8000
    image: fintracker-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
