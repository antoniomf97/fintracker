<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTracker</title>

    <!-- Installable web app (home-screen icon, standalone launch). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#38a3e1" />
    <!-- iOS ignores the manifest; it uses these instead. -->
    <link rel="apple-touch-icon" href="/fintracker.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FinTracker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash of the
      // wrong theme. Mirrors the logic in src/hooks/useTheme.ts.
      (function () {
        try {
          var saved = localStorage.getItem("fintracker_theme");
          var dark =
            saved === "dark" ||
            (!saved &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
