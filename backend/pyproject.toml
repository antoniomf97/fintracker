[project]
name = "fintracker-backend"
version = "0.1.0"
description = "Backend API for fintracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
